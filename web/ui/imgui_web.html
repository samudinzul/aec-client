<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AEC Client - Web UI (Dear ImGui)</title>
    <link rel="stylesheet" href="/static/imgui_web.css">
</head>
<body>
    <div id="root">
        <div style="text-align: center; padding: 50px; color: #e8e8e8; font-family: system-ui, sans-serif;">
            <h1>Loading AEC Web UI (Dear ImGui)...</h1>
            <p>Please wait while the UI initializes...</p>
        </div>
    </div>
    <div id="boot-err" style="display:none; position:fixed; left:50%; top:12px; transform:translateX(-50%); max-width:640px; background:#3a1d1d; color:#ffd9d9; border:1px solid #c04545; border-radius:8px; padding:10px 14px; font:13px system-ui,sans-serif; z-index:2000;"></div>

    <script src="/static/imgui_web.js"></script>
    <script>
        function showBootErr(msg) {
            var el = document.getElementById('boot-err');
            el.style.display = 'block';
            el.textContent = msg;
        }
        window.addEventListener('error', function (e) {
            // Surface real JS errors (file/line/message), not "undefined".
            var detail = (e && e.message) || (e && e.error && e.error.message) || 'unknown error';
            var where = (e && e.filename) ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : '';
            console.error('Page error:', detail, where, e && e.error);
        });
        window.addEventListener('unhandledrejection', function (e) {
            var detail = (e && e.reason && (e.reason.message || e.reason)) || 'unknown rejection';
            console.error('Unhandled rejection:', detail);
        });
        (function boot() {
            if (typeof initWebImGui !== 'function') {
                console.error('initWebImGui missing — imgui_web.js did not load or define it');
                showBootErr('Failed to load Dear ImGui script (/static/imgui_web.js returned 404 or did not define initWebImGui). '
                    + 'Try /classic for the fallback UI, then check the server log.');
                return;
            }
            try {
                initWebImGui();
            } catch (err) {
                console.error('initWebImGui threw:', err);
                showBootErr('Dear ImGui init failed: ' + (err && err.message ? err.message : err));
            }
        })();
    </script>
</body>
</html>
